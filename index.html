// ---------------------------------------------------------- canvas view
class CanvasView {
  constructor(host) {
    this.host = host;
    this.cv = h('canvas', { class: 'cv', tabindex: '0', 'aria-label': 'Drawing. Drag to pan, scroll or pinch to zoom, double-click to fit.' });
    host.append(this.cv);
    this.ctx = this.cv.getContext('2d');
    this.content = null;
    this.zoom = 1; this.cx = 0; this.cy = 0; this.fitted = true;
    this.ptrs = new Map();
    this.ro = new ResizeObserver(() => this.resize());
    this.ro.observe(host);
    this.bind();
  }
  bind() {
    const cv = this.cv;
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)));
    }, { passive: false });
    cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId, [e.offsetX, e.offsetY]); });
    cv.addEventListener('pointermove', (e) => {
      const prev = this.ptrs.get(e.pointerId);
      this.readout(e.offsetX, e.offsetY);
      if (!prev) return;
      const cur = [e.offsetX, e.offsetY];
      if (this.ptrs.size === 1) {
        this.cx -= (cur[0] - prev[0]) / this.zoom;
        this.cy += (cur[1] - prev[1]) / this.zoom;
        this.fitted = false;
        this.paint();
      } else if (this.ptrs.size === 2) {
        const other = [...this.ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
        const d0 = Math.hypot(prev[0] - other[0], prev[1] - other[1]), d1 = Math.hypot(cur[0] - other[0], cur[1] - other[1]);
        if (d0 > 2) this.zoomAt((cur[0] + other[0]) / 2, (cur[1] + other[1]) / 2, d1 / d0);
      }
      this.ptrs.set(e.pointerId, cur);
    });
    const up = (e) => this.ptrs.delete(e.pointerId);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', () => ($('#coords').textContent = ''));
    cv.addEventListener('dblclick', () => this.fit());
    cv.addEventListener('keydown', (e) => {
      if (e.key === '+' || e.key === '=') this.zoomAt(this.w / 2, this.h / 2, 1.25);
      else if (e.key === '-') this.zoomAt(this.w / 2, this.h / 2, 0.8);
      else if (e.key === '0') this.fit();
      else return;
      e.preventDefault();
    });
  }
  readout(x, y) {
    if (!this.content) return;
    const X = this.cx + (x - this.w / 2) / this.zoom, Y = this.cy - (y - this.h / 2) / this.zoom;
    $('#coords').textContent = this.content.kind === 'sheet' ? `${X.toFixed(0)}, ${Y.toFixed(0)} mm on the sheet` : `x ${X.toFixed(0)}   ${this.content.key === 'elev' ? 'z' : 'y'} ${Y.toFixed(0)}`;
  }
  zoomAt(x, y, f) {
    const X = this.cx + (x - this.w / 2) / this.zoom, Y = this.cy - (y - this.h / 2) / this.zoom;
    this.zoom = Math.min(Math.max(this.zoom * f, this.minZoom || 1e-4), 80);
    this.cx = X - (x - this.w / 2) / this.zoom;
    this.cy = Y + (y - this.h / 2) / this.zoom;
    this.fitted = false;
    this.paint();
  }
  resize() {
    const r = this.host.getBoundingClientRect();
    this.w = Math.max(1, r.width);
    this.h = Math.max(1, r.height);
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    this.cv.width = Math.round(this.w * dpr);
    this.cv.height = Math.round(this.h * dpr);
    this.cv.style.width = this.w + 'px';
    this.cv.style.height = this.h + 'px';
    this.dpr = dpr;
    if (this.fitted) this.fit(false);
    this.paint();
  }
  set(content, dataChanged) {
    const same = this.content && this.content.key === content.key;
    this.content = content;
    if (!same || this.fitted || !dataChanged) this.fit(false);
    this.paint();
  }
  fit(paint = true) {
    if (!this.content || this.w < 80 || this.h < 80) return;
    const b = this.content.bbox, pad = Math.min(28, this.w / 10);
    const top = 50; // room for the toolbar
    const bw = Math.max(1, b[2] - b[0]), bh = Math.max(1, b[3] - b[1]);
    this.zoom = Math.min((this.w - 2 * pad) / bw, (this.h - pad - top) / bh);
    this.minZoom = this.zoom / 8;
    this.cx = (b[0] + b[2]) / 2;
    this.cy = (b[1] + b[3]) / 2 + (top - pad) / 2 / this.zoom;
    this.fitted = true;
    if (paint) this.paint();
  }
  paint() {
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => { this.raf = null; this.draw(); });
  }
  draw(ctx = this.ctx, scale = this.dpr) {
    if (!this.content || !(this.zoom > 0)) return;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const k = this.zoom, a = this.w / 2 - this.cx * k, b = this.h / 2 + this.cy * k;
    if (this.content.kind === 'sheet') {
      ctx.fillStyle = isDarkUI() ? '#0d1012' : '#d9ddd8';
      ctx.fillRect(0, 0, this.w, this.h);
      const sh = this.content.sheet;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#fff';
      ctx.fillRect(a, b - sh.size[1] * k, sh.size[0] * k, sh.size[1] * k);
      ctx.restore();
      paintCanvas(ctx, sh.items, { a, b, k }, printPalette(), { lw: (w) => Math.max(0.5, w * k), dash: (d) => d * k });
      return;
    }
    const pal = screenPalette();
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, this.w, this.h);
    paintCanvas(ctx, this.content.items, { a, b, k }, pal, { lw: (w) => Math.max(0.7, w * 3.3), dash: (d) => d * SCALE * k });
  }
  png() {
    const c = document.createElement('canvas');
    const sc = 2;
    c.width = Math.round(this.w * sc);
    c.height = Math.round(this.h * sc);
    this.draw(c.getContext('2d'), sc);
    return c;
  }
}

function renderData() {

    const going = s.kind === 'landing' ? `${fmtDim(m.p.E)} × ${fmtDim(m.p.E)}` : f1(m.G);
    const where = s.kind === 'upper' ? `x ${fmtDim(s.line.v)} from the slab edge` : `y ${fmtDim(s.line.v)} from the first riser`;
    return `<tr class="${s.kind === 'landing' ? 'landing' : ''}"><td>${s.k}</td><td>${s.kind === 'landing' ? 'landing' : s.kind + ' flight'}</td><td class="n">${f1(s.top)}</td><td class="n">${f1(s.bot)}</td><td class="n">${going}</td><td>${where}</td></tr>`;
  }).join('');
  const cut = m.cut.map((r) => `<tr><td>${esc(r[0])}</td><td class="n">${r[1]}</td><td class="n">${esc(fmtDim(Number(r[2])))}</td><td class="n">${esc(String(r[3]))}</td><td class="n">${esc(String(r[4]))}</td><td>${esc(r[5])}</td></tr>`).join('');
  $('#docHost').innerHTML = `<div class="doc">
    <div class="doc-head"><h2>Steps</h2></div>
    <div class="tbl"><table><thead><tr><th>Step</th><th>Where</th><th class="n">Top +</th><th class="n">Underside +</th><th class="n">Going</th><th>Riser line (front face)</th></tr></thead><tbody>${steps}</tbody></table></div>
    <p class="fine">${m.N} rises × ${f1(m.R)} = ${fmtDim(m.p.Y)}. ${m.p.SP ? 'The last rise goes up to the upper floor at the slab edge.' : 'The top stair is level with the upper floor.'}</p>
    <div class="doc-head"><h2>Cut list</h2><button class="btn" id="cutCsv" type="button">Download CSV</button></div>
    <div class="tbl"><table class="cut"><thead><tr><th>Part</th><th class="n">Qty</th><th class="n">Length</th><th class="n">Width</th><th class="n">Thick</th><th>Notes</th></tr></thead><tbody>${cut}</tbody></table></div>
    <p class="fine">Net sizes in mm. Stringer length is the board length along the pitch; cut the profile from the elevation or the DXF.</p>
  </div>`;
  $('#cutCsv').addEventListener('click', () => exportOne('csv'));
}

// --------------------------------------------------------------- export
function stem() {
  const n = (S.params.name || 'stair').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 48);
  return n || 'stair';
}
function cutCsv() {
  const head = ['Part', 'Qty', 'Length mm', 'Width mm', 'Thickness mm', 'Notes'];
  const q = (v) => { const s = String(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return '﻿' + [head, ...S.m.cut].map((r) => r.map(q).join(';')).join('\r\n') + '\r\n';
}
async function exportOne(kind, btn) {
  if (!S.m || S.error) { toast('Fix the inputs first – the stair can’t be drawn yet.'); return; }
  const s = stem();
  if (btn) btn.classList.add('busy');
  try {
    if (kind === 'pdf') {
      await loadLib('jspdf');
      const sh = sheetOf();
      const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3', compress: true });
      doc.setFont('helvetica', 'normal');
      paintPdf(doc, sh.items, { a: 0, b: sh.size[1], k: 1 }, printPalette());
      doc.setProperties({ title: S.params.name, creator: 'L-stair designer' });
      download(`${s}_A3.pdf`, doc.output('blob'));
    } else if (kind === 'dxf') {
      const { plan, elev } = S.drawings;
      const dx = plan.bbox[2] + 1500 - elev.bbox[0];
      const items = [...plan.items, ...mapItems(elev.items, (q) => [q[0] + dx, q[1] + plan.bbox[1] - elev.bbox[1]])];
      download(`${s}.dxf`, toDXF(items, S.params.BW), 'application/dxf');
    } else if (kind === 'svg') {
      const id = ['plan', 'elev', 'sheet'].includes(S.view) ? S.view : 'plan';
      if (id === 'sheet') {
        const sh = sheetOf();
        download(`${s}_A3.svg`, toSVG(sh.items, sh.bbox, printPalette(), 1), 'image/svg+xml');
      } else {
        const d = S.drawings[id];
        download(`${s}_${id === 'elev' ? 'elevation' : 'plan'}.svg`, toSVG(d.items, d.bbox, printPalette(), SCALE), 'image/svg+xml');
      }
    } else if (kind === 'png') {
      let c;
      if (S.view === '3d' && view3d) c = view3d.snapshot();
      else {
        if (!['plan', 'elev', 'sheet'].includes(S.view)) setView('plan');
        c = canvasView.png();
      }
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      download(`${s}_${S.view === '3d' ? '3d' : S.view}.png`, blob, 'image/png');
    } else if (kind === 'obj') {
      if (!view3d || view3d.modelFor !== S.m) {
        const was = S.view;
        await loadLib('three');
        if (!view3d) { view3d = new View3D($('#glHost')); view3d.init(); }
        view3d.setModel(S.m);
        view3d.modelFor = S.m;
        view3d.show(was === '3d');
      }
      download(`${s}.obj`, view3d.toOBJ(`${S.params.name} – L-stair designer`), 'text/plain');
    } else if (kind === 'csv') download(`${s}_cutlist.csv`, cutCsv(), 'text/csv');
    else if (kind === 'json') download(`${s}.json`, JSON.stringify(S.params, null, 2), 'application/json');
  } catch (e) {
    console.error(e);
    toast(`Export failed: ${e.message}`);
  } finally {
    if (btn) btn.classList.remove('busy');
  }
}

// ------------------------------------------------------------ converter
function parseInches(raw) {
  let s = String(raw).trim().replace(/[″”]/g, '"').replace(/[′’]/g, "'").replace(/,/g, '.');
  if (!s) return null;
  let ft = 0;
  const mf = s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft)\s*(.*)$/i);
  if (mf) { ft = Number(mf[1]); s = mf[2].trim(); }
  s = s.replace(/("|in|inch|inches)$/i, '').trim();
  let inch = 0;
  if (s) {
    const m = s.match(/^(?:(\d+(?:\.\d+)?)(?:[\s-]+|$))?(?:(\d+)\s*\/\s*(\d+))?$/);
    if (!m || (m[1] === undefined && m[2] === undefined)) return null;
    inch = (m[1] ? Number(m[1]) : 0) + (m[2] ? Number(m[2]) / Number(m[3]) : 0);
  }
  return ft * 12 + inch;
}
function inchesText(mm) {
  const inch = mm / 25.4;
  let n16 = Math.round(inch * 16);
  const whole = Math.floor(n16 / 16);
  let fr = n16 % 16, den = 16;
  while (fr && fr % 2 === 0) { fr /= 2; den /= 2; }
  const ft = Math.floor(whole / 12), rem = whole % 12;
  const frac = fr ? ` ${fr}/${den}` : '';
  return ft ? `${ft}′ ${rem}${frac}″` : `${rem}${frac}″`;
}
function bindConverter() {
  $('#convIn').addEventListener('input', (e) => {
    const v = parseInches(e.target.value);
    $('#convInOut').textContent = v === null ? (e.target.value.trim() ? 'not a length' : '–') : `${fmtDim(v * 25.4)} mm`;
  });
  $('#convMm').addEventListener('input', (e) => {
    const v = Number(String(e.target.value).replace(',', '.'));
    const out = $('#convMmOut');
    out.textContent = e.target.value.trim() === '' ? '–' : Number.isFinite(v) ? inchesText(v) : 'not a number';
    out.title = Number.isFinite(v) && e.target.value.trim() ? `${(v / 25.4).toFixed(3)} in` : '';
  });
}

// ----------------------------------------------------------------- boot
function bindChrome() {
  $$('.preset').forEach((b) => b.addEventListener('click', () => loadParams(clone(PRESETS[b.dataset.preset]), `Loaded ${b.querySelector('b').textContent}`)));
  $('#undo').addEventListener('click', undo);
  $('#redo').addEventListener('click', redo);
  $('#saveBtn').addEventListener('click', () => exportOne('json'));
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { loadParams(JSON.parse(String(rd.result)), `Loaded ${f.name}`); } catch (err) { toast(`Could not read ${f.name}`); }
      e.target.value = '';
    };
    rd.readAsText(f);
  });
  $$('[data-export]').forEach((b) => b.addEventListener('click', () => {
    $('#exportMenu').open = false;
    exportOne(b.dataset.export, b);
  }));
  document.addEventListener('click', (e) => {
    const mnu = $('#exportMenu');
    if (mnu.open && !mnu.contains(e.target)) mnu.open = false;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('#exportMenu').open = false;
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
    if (typing || !(e.ctrlKey || e.metaKey)) return;
    if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((e.key.toLowerCase() === 'z' && e.shiftKey) || e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  });
  $('#tbVerdict').addEventListener('click', () => {
    const panel = $('#rulesPanel');
    if (panel.offsetParent !== null && getComputedStyle(panel).display !== 'none') {
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      flash(panel);
    } else setView('rules');
  });
  $('#fitBtn').addEventListener('click', () => canvasView && canvasView.fit());
  $('#palBtn').addEventListener('click', () => {
    S.dark = !S.dark;
    store('darkPaper', S.dark);
    $('#palBtn').textContent = S.dark ? 'Paper' : 'Dark';
    if (canvasView) canvasView.paint();
  });
  for (const k of ['walls', 'walk']) {
    $(`#gl_${k}`).addEventListener('click', () => {
      if (!view3d) return;
      view3d.opts[k] = !view3d.opts[k];
      store('opts3d', view3d.opts);
      view3d.applyOpts();
      syncGlBar();
    });
  }
  $$('[data-cam]').forEach((b) => b.addEventListener('click', () => view3d && view3d.view(b.dataset.cam)));
  const themeChanged = () => {
    if (canvasView) canvasView.paint();
    if (view3d) view3d.setTheme(isDarkUI());
  };
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged);
}

function boot() {
  buildForm();
  buildTabs();
  bindChrome();
  bindConverter();
  const saved = stored('params');
  S.params = normalize(saved || PRESETS.example);
  S.dark = !!stored('darkPaper');
  $('#palBtn').textContent = S.dark ? 'Paper' : 'Dark';
  S.committed = JSON.stringify(S.params);
  updateUndo();
  syncForm();
  const v = stored('view');
  setView(VIEWS.some((x) => x.id === v) ? v : 'plan');
  rebuild();
}

// exposed for tests and for tinkering in the console
window.LStair = { compute, drawPlan, drawElevation, buildSheet, toDXF, toSVG, hlr, PRESETS, DEFAULTS, normalize, get state() { return S; }, exportOne };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
